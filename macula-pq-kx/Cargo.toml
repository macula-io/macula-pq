[package]
name = "macula-pq-kx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SecP384r1MLKEM1024 hybrid key exchange for rustls, implemented here rather than depended on"
publish = false

# Pinned with `=` deliberately. Every length and code point this crate is
# built on was MEASURED against these exact versions; a silent minor bump
# would move the ground the measurements stand on.
[dependencies]
macula-mlkem = { workspace = true }
rustls = { version = "=0.23.43", default-features = false, features = ["aws-lc-rs", "std"] }

[dev-dependencies]
aws-lc-rs = "=1.18.1"
