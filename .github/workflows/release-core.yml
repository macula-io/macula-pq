name: Release to crates.io

# Publishes every crate from one pushed release tag. THE TAG IS THE
# RELEASE: there is no approval step.
#
# - A pushed tag vX.Y.Z runs `verify`: every crate is publishable at the
#   tag's version, the full gate passes, and a dry-run publish succeeds.
#   Then `publish` runs in the `crates-io` environment. That environment
#   admits only `v*.*.*` tags and holds the crates.io token, so the token
#   is readable by this job on a release tag and by nothing else: not a
#   branch run, not another workflow.
# - Who can publish is therefore who can push a `v*` tag. Today that is
#   the repository's only account. Grant anyone else write access and add
#   a tag ruleset restricting `v*` creation, or the tag stops being a gate.
# - A manual dispatch is a dry run: it runs `verify` for the given tag and
#   never publishes. GitHub only dispatches a workflow that is on the
#   default branch.
#
# ⛔ EVERY CRATE IS PUBLISHED. ONLY `macula-pqc` IS A SUPPORTED ENTRY
# POINT. Both halves matter and a later reader will otherwise "simplify"
# one of them away.
#
# WHY ALL ARE PUBLISHED: a mechanical constraint, not a product
# decision. Cargo refuses to publish a crate whose dependencies are not
# themselves on crates.io. `macula-pqc` depends on `macula-pqc-kx`, and so
# on down, so publishing the facade requires publishing everything it
# stands on. The inner crates exist on the registry without being
# advertised.
#
# WHAT TO DEPEND ON IS `macula-pqc`. There is no use case for consuming
# `macula-keccak` alone: nothing in this stack needs SHA-3 outside ML-KEM
# and ML-DSA, because TLS uses SHA-2, and this is not a general-purpose
# Keccak maintained for strangers.
#
# ⛔ WHY THESE ARE SEPARATE CRATES AND NOT ONE WITH MODULES. The layering is
# load-bearing:
#
#   macula-keccak   zeroize only
#   macula-mlkem    keccak + OS randomness + zeroize    NO rustls
#   macula-mldsa    keccak + OS randomness + zeroize    NO rustls
#   macula-pqc-kx    mlkem + rustls + aws-lc-rs
#   macula-pqc       facade
#
# Collapse that and anyone wanting ML-KEM or ML-DSA is forced to take
# rustls and aws-lc-rs with it. Keeping the maths free of the TLS
# envelope is the whole reason the envelope and the maths were separated
# in the first place. IF `macula-mlkem` OR `macula-mldsa` EVER GAINS A
# RUSTLS DEPENDENCY THAT LAYERING IS GONE, and nobody will notice from
# inside the crate.
#
# ⚠ A NEW CRATE CARRIES `publish = false` UNTIL IT IS READY, ON PURPOSE.
# The crates share one version and release together from one tag, so
# `verify` refuses a tag while ANY of them still carries the flag, rather
# than leave a half-released set. Clear it deliberately, when the crate is
# ready, never in a sweep "to make the workflow work".

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to dry-run, vX.Y.Z. Never publishes.'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

concurrency:
  group: release-crates-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Guard, gate and dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ⛔ `cargo publish --workspace` EXITS 0 WHEN EVERY CRATE CARRIES
      # `publish = false`: it warns "nothing to publish" and reports
      # success. Without this step a stray tag would give a green release
      # run that released nothing. The version comes from `cargo
      # metadata`, which resolves what each crate inherits from the
      # workspace.
      - name: Every crate is publishable, at the tag's version
        run: |
          want="${RELEASE_TAG#v}"
          fail=0
          while IFS=$'\t' read -r name version publishable; do
            if [ "$version" != "$want" ]; then
              echo "::error::$name is $version, the tag says $want"
              fail=1
            fi
            if [ "$publishable" != yes ]; then
              echo "::error::$name carries publish = false"
              fail=1
            fi
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | [.name, .version, (if .publish == [] then "no" else "yes" end)] | @tsv')
          exit "$fail"

      # A tag push is a separate event from the branch push CI validated,
      # so there is no prior output to reuse. Same script as the hook and CI.
      - run: ./scripts/test.sh

      # Packages every crate and builds it against the others through a
      # local registry, in dependency order. Needs no registry token.
      - name: Dry-run publish
        run: cargo publish --workspace --dry-run

  publish:
    name: Publish to crates.io
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # In dependency order. After each upload cargo polls crates.io until
      # the crate appears, and gives up after a fixed wait (the setting
      # that lengthens it is unstable). If crates.io is slower than that,
      # rerun with `--exclude` for every crate already published: crates.io
      # refuses the same version twice.
      #
      # CRATES_IO_TOKEN is a plain crates.io API token, not OIDC Trusted
      # Publishing: crates.io has no pending-publisher mechanism, so a
      # Trusted Publisher can only be configured AFTER a crate's first
      # release exists. Migrate to rust-lang/crates-io-auth-action once
      # each crate has shipped once.
      - name: Publish, in dependency order
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
