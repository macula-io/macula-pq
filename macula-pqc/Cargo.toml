[package]
name = "macula-pqc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "rustls configuration builders locked to post-quantum hybrid key exchange: SecP384r1MLKEM1024 and SecP256r1MLKEM768"
keywords = ["post-quantum", "ml-kem", "rustls", "tls", "hybrid"]
categories.workspace = true

[dependencies]
rustls = { workspace = true }
macula-pqc-kx = { workspace = true }

[dev-dependencies]
# A CA and a server certificate for real TLS handshakes in the tests. The
# aws-lc-rs backend, because it is already linked; ring would be a second.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
