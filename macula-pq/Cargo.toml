[package]
name = "macula-pq"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The facade: the one place macula's post-quantum posture is decided"
publish = false

[dependencies]
rustls = { workspace = true }
macula-pq-kx = { path = "../macula-pq-kx" }

[dev-dependencies]
# A CA and a server certificate for real TLS handshakes in the tests. The
# aws-lc-rs backend, because it is already linked; ring would be a second.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
